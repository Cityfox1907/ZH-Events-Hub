<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZüriBühni — Event Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --paper: #f7f2ea; --paper-dim: #efe7d8; --card: #fdfaf3;
    --ink: #1c1917; --ink-muted: #57534e; --ink-faint: #a8a29e;
    --line: #e7ddc9; --line-strong: #d4c4a8;
    --burgundy: #7c1f1f; --burgundy-dark: #5a1414; --brass: #b8893d;
    --display-font: 'Fraunces', serif; --body-font: 'DM Sans', sans-serif;
    --sidebar-w: 72px;
  }
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--body-font); background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased; }
  body::after { content:''; position:fixed; inset:0; pointer-events:none; z-index:9999; opacity:0.025; mix-blend-mode:multiply; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); background-size:256px; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.3)} }
  ::-webkit-scrollbar{width:5px;height:5px} ::-webkit-scrollbar-track{background:transparent} ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:9999px}
  @media(max-width:768px){ .sidebar-nav{display:none!important} .main-area{margin-left:0!important} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="components-v3.jsx"></script>
<script type="text/babel">

// All events combined
const ALL_EVENTS = [
  { id:'evt-01', title:'Abendkonzert im Park', subtitle:'Ein Sommerabend mit Jazz und Soul', description:'Ein laues Sommerabendkonzert im Herzen von Kreis 4. Drei Acts zwischen Jazz, Soul und Neo-Funk spielen unter freiem Himmel. Das Parkhaus öffnet die Dachterrasse und serviert Drinks direkt am Platz. Einlass ab 18:30, erster Act um 19:30. Decken und Kissen sind erlaubt — Regenschirme bitte nicht.', category:'Konzert', venue:'Parkhaus', district:'Kreis 4', size:'major', time:'19:30', dateLong:'Sonntag, 17. Mai 2026', dateShort:'So, 17. Mai', going:324, price:'ab CHF 45', tags:['jazz','soul','open-air','sommer'] },
  { id:'evt-02', title:'Streichquartett Nr. 14', subtitle:'Kammermusik-Zyklus Frühling', description:'Das Zürcher Kammerensemble spielt Schuberts «Der Tod und das Mädchen» in der Tonhalle. Ein Abend für alle, die Musik nicht nur hören, sondern spüren wollen. Die Akustik des Grossen Saals macht jedes pianissimo zum Erlebnis. Pause mit Wein im Foyer inklusive.', category:'Klassik', venue:'Tonhalle', district:'Enge', size:'mega', time:'20:00', dateLong:'Sonntag, 17. Mai 2026', dateShort:'So, 17. Mai', going:891, price:'ab CHF 65', tags:['klassik','sinfonie','premium'] },
  { id:'evt-03', title:'Open Mic Night', subtitle:'Offene Bühne für Poesie und Comedy', description:'Jede:r darf auf die Bühne. 5 Minuten, ein Mikrofon, keine Regeln. Ob Slam Poetry, Stand-up oder experimentelles Storytelling — das Publikum entscheidet mit Applaus. Anmeldung vor Ort bis 20:45.', category:'Comedy', venue:'Café Plüsch', district:'Niederdorf', size:'intimate', time:'21:00', dateLong:'Sonntag, 17. Mai 2026', dateShort:'So, 17. Mai', going:42, price:'Eintritt frei', tags:['comedy','poetry','open-mic'] },
  { id:'evt-04', title:'Techno im Keller', subtitle:'Bassgetriebene Nacht', description:'Die Zukunft öffnet den Keller für eine Nacht zwischen Techno und Industrial. Drei DJs, ein Soundsystem, kein Tageslicht. Wer die Zukunft kennt, weiss: Hier ist der Bass physisch. Dress code: Schwarz empfohlen, nicht Pflicht.', category:'Klubs', venue:'Zukunft', district:'Kreis 5', size:'mid', time:'23:00', dateLong:'Sonntag, 17. Mai 2026', dateShort:'So, 17. Mai', going:187, price:'ab CHF 25', tags:['techno','underground','nightlife'] },
  { id:'evt-05', title:'Skulptur & Licht', subtitle:'Neue Werke aus der Galerie', description:'Haus Konstruktiv zeigt Arbeiten von drei Zürcher Künstler:innen, die mit Licht, Schatten und kinetischer Skulptur arbeiten. Die Ausstellung läuft seit April — aber dieser Abend bietet eine exklusive Kuratorenführung um 18:30 mit anschliessendem Apéro.', category:'Kunst', venue:'Haus Konstruktiv', district:'City', size:'mid', time:'18:00', dateLong:'Sonntag, 17. Mai 2026', dateShort:'So, 17. Mai', going:73, price:'ab CHF 12', tags:['kunst','vernissage','skulptur'] },
  { id:'evt-06', title:'Sommertheater', subtitle:'Klassiker unter freiem Himmel', description:'Das Theater Rigiblick spielt Tschechows «Kirschgarten» unter dem Abendhimmel. Eine Inszenierung, die den Witz und die Melancholie des Originals ernst nimmt. Bei Regen wird in den Innenraum verlegt — aber die Wetterprognose sieht gut aus.', category:'Theater', venue:'Rigiblick', district:'Oberstrass', size:'major', time:'19:00', dateLong:'Sonntag, 17. Mai 2026', dateShort:'So, 17. Mai', going:256, price:'ab CHF 38', tags:['theater','klassiker','open-air'] },
  { id:'evt-11', title:'Volkshaus Sessions', subtitle:'Drei Bands, ein Abend', description:'Das Volkshaus wird zur Bühne für drei Schweizer Indie-Bands. Vom Singer-Songwriter bis zur vollen fünfköpfigen Formation. Stehplätze unten, Sitzplätze auf der Galerie.', category:'Konzert', venue:'Volkshaus', district:'Kreis 4', size:'major', time:'20:00', dateLong:'Dienstag, 19. Mai 2026', dateShort:'Di, 19. Mai', going:412, price:'ab CHF 35', tags:['indie','live','konzert'] },
];

function getEventById(id) { return ALL_EVENTS.find(e => e.id === id); }

// Read event ID from URL hash
function getEventIdFromHash() {
  const h = window.location.hash;
  if (h && h.startsWith('#event=')) return h.replace('#event=','');
  return null;
}

function EventDetailPage() {
  const [eventId, setEventId] = React.useState(getEventIdFromHash());
  const [activeNav, setActiveNav] = React.useState('home');

  React.useEffect(() => {
    const handler = () => setEventId(getEventIdFromHash());
    window.addEventListener('hashchange', handler);
    return () => window.removeEventListener('hashchange', handler);
  }, []);

  const event = eventId ? getEventById(eventId) : ALL_EVENTS[0];
  if (!event) return <div style={{ padding:64, textAlign:'center' }}>Event nicht gefunden.</div>;

  return (
    <div style={{ display:'flex', minHeight:'100vh' }}>
      <SidebarNav active={activeNav} onNavigate={setActiveNav} />
      <div className="main-area" style={{ marginLeft:'var(--sidebar-w)', flex:1, minWidth:0 }}>
        {/* Hero */}
        <div style={{ position:'relative', width:'100%', aspectRatio:'21/9', minHeight:280, background:getGradient(event.id) }}>
          <div style={{ position:'absolute', inset:0, background:'linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.15) 50%, transparent 100%)' }}></div>
          {/* Back */}
          <a href="ZueriBuehni v3.html" style={{ position:'absolute', top:20, left:20, zIndex:2, width:40, height:40, borderRadius:'50%', background:'rgba(0,0,0,0.3)', backdropFilter:'blur(4px)', display:'flex', alignItems:'center', justifyContent:'center', color:'#fff', textDecoration:'none', fontSize:20 }}>←</a>
          <div style={{ position:'absolute', bottom:0, left:0, right:0, padding:'32px clamp(20px,4vw,48px)', zIndex:1, maxWidth:1152, margin:'0 auto' }}>
            <div style={{ display:'flex', gap:8, marginBottom:12 }}>
              <SizeBadge size={event.size} />
              <span style={{ padding:'2px 10px', borderRadius:9999, fontSize:10, fontFamily:'var(--body-font)', fontWeight:500, letterSpacing:'0.15em', textTransform:'uppercase', background:'rgba(255,255,255,0.15)', color:'var(--paper)', backdropFilter:'blur(4px)' }}>{event.category}</span>
            </div>
            <h1 style={{ fontFamily:'var(--display-font)', fontSize:'clamp(32px,5vw,56px)', color:'#fff', lineHeight:1, fontVariationSettings:'"SOFT" 50, "WONK" 0', letterSpacing:'-0.02em', fontWeight:400 }}>{event.title}</h1>
            <p style={{ fontSize:18, color:'rgba(255,255,255,0.7)', fontFamily:'var(--body-font)', marginTop:8 }}>{event.subtitle}</p>
          </div>
        </div>

        {/* Content */}
        <div style={{ maxWidth:1152, margin:'0 auto', padding:'0 clamp(20px,4vw,48px)' }}>
          <div className="detail-layout" style={{ display:'grid', gridTemplateColumns:'1fr 320px', gap:48, paddingTop:40, paddingBottom:96 }}>
            {/* Left */}
            <div style={{ minWidth:0 }}>
              <p style={{ fontSize:18, lineHeight:1.7, color:'var(--ink-muted)', maxWidth:'64ch', marginBottom:32 }}>{event.description}</p>

              {/* Actions */}
              <div style={{ display:'flex', gap:12, marginBottom:40 }}>
                <GoingButton />
                <button style={{ height:44, padding:'0 24px', borderRadius:9999, border:'1px solid var(--line-strong)', background:'transparent', color:'var(--ink)', fontSize:14, fontFamily:'var(--body-font)', fontWeight:500, cursor:'pointer', transition:'all 200ms' }}>Tickets kaufen</button>
                <button style={{ height:44, padding:'0 20px', borderRadius:9999, border:'1px solid var(--line)', background:'transparent', color:'var(--ink-muted)', fontSize:14, fontFamily:'var(--body-font)', cursor:'pointer' }}>Teilen</button>
              </div>

              {/* Comments */}
              <div style={{ borderTop:'1px solid var(--line)', paddingTop:32 }}>
                <CommentsSection eventId={event.id} />
              </div>
            </div>

            {/* Right sidebar */}
            <div>
              <div style={{ position:'sticky', top:80, display:'flex', flexDirection:'column', gap:20 }}>
                {/* Info card */}
                <div style={{ borderRadius:8, border:'1px solid var(--line)', background:'var(--card)', overflow:'hidden' }}>
                  {[
                    { label:'DATUM', value:event.dateLong },
                    { label:'BEGINN', value:event.time },
                    { label:'VENUE', value:`${event.venue} · ${event.district}` },
                    { label:'GRÖSSE', value:event.size.charAt(0).toUpperCase()+event.size.slice(1) },
                    { label:'PREIS', value:event.price },
                  ].map((m,i) => (
                    <div key={m.label} style={{ padding:'16px 20px', borderBottom: i<4 ? '1px solid var(--line)' : 'none' }}>
                      <div style={{ fontSize:10, letterSpacing:'0.15em', textTransform:'uppercase', color:'var(--ink-faint)', fontFamily:'var(--body-font)', marginBottom:4 }}>{m.label}</div>
                      <div style={{ fontSize:17, fontFamily:'var(--display-font)', fontVariationSettings:'"SOFT" 50, "WONK" 0', color:'var(--ink)' }}>{m.value}</div>
                    </div>
                  ))}
                </div>

                {/* Live counter */}
                <div style={{ borderRadius:8, border:'1px solid var(--line)', background:'var(--card)', padding:'20px' }}>
                  <div style={{ fontSize:10, letterSpacing:'0.15em', textTransform:'uppercase', color:'var(--ink-faint)', marginBottom:8 }}>LIVE</div>
                  <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                    <div style={{ width:8, height:8, borderRadius:'50%', background:'#22c55e', animation:'pulse 2s infinite' }}></div>
                    <span style={{ fontFamily:'var(--display-font)', fontSize:32, lineHeight:1, fontVariationSettings:'"SOFT" 50, "WONK" 0' }}>{event.going}</span>
                  </div>
                  <div style={{ fontSize:13, color:'var(--ink-muted)', marginTop:4 }}>Personen gehen hin</div>
                </div>

                {/* Tags */}
                {event.tags && (
                  <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
                    {event.tags.map(tag => (
                      <span key={tag} style={{ padding:'4px 12px', borderRadius:9999, border:'1px solid var(--line)', fontSize:11, fontFamily:'var(--body-font)', letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--ink-muted)' }}>{tag}</span>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      </div>

      <style>{`
        @media(max-width:900px) {
          .detail-layout { grid-template-columns: 1fr !important; }
        }
      `}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<EventDetailPage />);
</script>
</body>
</html>
